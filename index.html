<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Properties</title>
<meta name="description" content="Available flats for sale and rent." />
<meta property="og:type" content="website" />
<meta property="og:title" content="My Properties" />
<meta property="og:description" content="Available flats for sale and rent." />
<meta name="theme-color" content="#0f766e" />
<style>
:root{
  --accent:#0f766e;
  --accent-soft:#0f766e14;
  --bg:#fbfbfa;
  --surface:#ffffff;
  --ink:#16181d;
  --ink-2:#5b6270;
  --ink-3:#8b93a1;
  --line:#e7e8ec;
  --line-2:#f1f2f5;
  --radius:16px;
  --shadow-sm:0 1px 2px rgba(16,20,30,.05), 0 1px 3px rgba(16,20,30,.04);
  --shadow-md:0 4px 12px rgba(16,20,30,.07), 0 2px 4px rgba(16,20,30,.04);
  --shadow-lg:0 24px 48px -12px rgba(16,20,30,.18);
  --wa:#25D366;
  --maxw:1200px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:15px; line-height:1.5;
}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.hide{display:none !important}

/* ---------- Header ---------- */
header.site{
  position:sticky;top:0;z-index:60;
  background:rgba(251,251,250,.88);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.hdr{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .v{font-size:10.5px;opacity:.45;font-weight:600;margin-left:5px;letter-spacing:0}
.brand span{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-actions{display:flex;gap:8px;align-items:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:40px;padding:0 16px;border-radius:11px;font-size:14px;font-weight:600;
  transition:.15s ease; white-space:nowrap;
}
.btn:active{transform:scale(.975)}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{filter:brightness(.94)}
.btn-call{background:var(--accent);color:#fff}
.btn-call:hover{filter:brightness(.92)}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.btn-ghost:hover{border-color:#d5d7de}
.btn-solid{background:var(--ink);color:#fff}
.btn-solid:hover{filter:brightness(1.25)}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;pointer-events:none}
.ico{width:17px;height:17px;flex:none}

/* ---------- Hero ---------- */
.hero{padding:40px 0 28px}
.hero h1{margin:0 0 9px;font-size:31px;font-weight:800;letter-spacing:-.035em;line-height:1.15}
.hero p{margin:0;color:var(--ink-2);font-size:15.5px;max-width:640px}

/* ---------- Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;padding-bottom:80px}
.card{
  background:var(--surface);border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);
  transition:.22s cubic-bezier(.4,0,.2,1);cursor:pointer;
}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:#dcdee5}
.card-img{position:relative;aspect-ratio:4/3;background:var(--line-2);overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;transition:.4s}
.card:hover .card-img img{transform:scale(1.04)}
.card-img .ph{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-3)}
.badges{position:absolute;top:11px;left:11px;display:flex;gap:6px;flex-wrap:wrap}
.badge{
  padding:5px 10px;border-radius:7px;font-size:11.5px;font-weight:700;
  letter-spacing:.02em;background:rgba(255,255,255,.94);color:var(--ink);
  backdrop-filter:blur(6px);box-shadow:var(--shadow-sm);
}
.badge.available{background:#059669;color:#fff}
.badge.reserved{background:#d97706;color:#fff}
.badge.sold{background:#64748b;color:#fff}
.photo-count{
  position:absolute;bottom:11px;right:11px;padding:4px 9px;border-radius:7px;
  background:rgba(0,0,0,.62);color:#fff;font-size:11.5px;font-weight:600;
  display:flex;align-items:center;gap:5px;backdrop-filter:blur(4px);
}
.card-body{padding:15px 16px 16px}
.card-price{font-size:19px;font-weight:800;letter-spacing:-.03em;margin-bottom:3px}
.card-price small{font-size:12.5px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.card-title{font-size:15px;font-weight:600;margin-bottom:3px;line-height:1.35}
.card-loc{font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px;margin-bottom:12px}
.specs{display:flex;gap:14px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line-2);font-size:13.5px;color:var(--ink-2)}
.spec{display:flex;align-items:center;gap:6px;font-weight:500}
.spec svg{color:var(--ink-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.chip{padding:4px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:600}
.chip.more{background:var(--line-2);color:var(--ink-3)}

.empty{text-align:center;padding:80px 20px;color:var(--ink-3)}
.empty svg{margin:0 auto 16px;color:#c9cdd6}
.empty h3{margin:0 0 6px;color:var(--ink-2);font-size:16px;font-weight:600}
.empty p{margin:0;font-size:14px}

.skel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.skel .s1{aspect-ratio:4/3;background:linear-gradient(90deg,#f1f2f5 25%,#e7e8ec 50%,#f1f2f5 75%);background-size:200% 100%;animation:sh 1.4s infinite}
.skel .s2{height:15px;margin:16px;border-radius:5px;background:#f1f2f5}
.skel .s3{height:12px;margin:0 16px 20px;width:60%;border-radius:5px;background:#f1f2f5}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- Detail ---------- */
.detail{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.detail-top{
  position:sticky;top:0;z-index:10;background:rgba(251,251,250,.9);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
}
.detail-top .wrap{display:flex;align-items:center;gap:10px;height:60px}
.detail-top .sp{flex:1}
.gal{display:grid;gap:8px;grid-template-columns:2fr 1fr;margin:22px 0;border-radius:var(--radius);overflow:hidden}
.gal-main{aspect-ratio:4/3;background:var(--line-2);cursor:zoom-in;position:relative}
.gal-main img{width:100%;height:100%;object-fit:cover}
.gal-side{display:grid;gap:8px;grid-template-rows:1fr 1fr}
.gal-thumb{position:relative;background:var(--line-2);cursor:zoom-in;overflow:hidden}
.gal-thumb img{width:100%;height:100%;object-fit:cover}
.gal-more{
  position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;
}
.gal-single{grid-template-columns:1fr}
.gal-single .gal-side{display:none}
.gal-empty{
  aspect-ratio:16/7;background:var(--line-2);border-radius:var(--radius);margin:22px 0;
  display:flex;align-items:center;justify-content:center;color:var(--ink-3);flex-direction:column;gap:10px;
}
.dcols{display:grid;grid-template-columns:1fr 340px;gap:38px;padding-bottom:120px;align-items:start}
.dtitle{font-size:27px;font-weight:800;letter-spacing:-.035em;margin:0 0 7px;line-height:1.2}
.dloc{color:var(--ink-2);font-size:15px;display:flex;align-items:center;gap:6px;margin-bottom:18px}
.dstats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.dstat{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px 16px;min-width:92px;box-shadow:var(--shadow-sm);
}
.dstat b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.dstat span{font-size:12px;color:var(--ink-3);font-weight:500}
.sec{margin-bottom:28px}
.sec h3{font-size:16px;font-weight:700;margin:0 0 12px;letter-spacing:-.015em}
.sec p{margin:0;color:var(--ink-2);white-space:pre-wrap;line-height:1.65;font-size:14.7px}
.taglist{display:flex;flex-wrap:wrap;gap:8px}
.tag{
  display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;
}
.tag svg{color:var(--accent);flex:none}
.aside{position:sticky;top:80px}
.pricebox{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow-md);
}
.pricebox .p{font-size:29px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.pricebox .pn{font-size:13.5px;color:var(--ink-3);margin-top:4px}
.pricebox .divider{height:1px;background:var(--line-2);margin:18px 0}
.pricebox .btn{width:100%;height:46px;font-size:15px;margin-bottom:9px}
.pricebox .note{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:12px;line-height:1.5}
.mapbtn{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:14px;margin-top:14px}

.mobilebar{
  position:fixed;bottom:0;left:0;right:0;z-index:90;display:none;gap:9px;
  padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
}
.mobilebar .btn{flex:1;height:46px;font-size:15px}

/* ---------- Lightbox ---------- */
.lb{position:fixed;inset:0;z-index:200;background:rgba(8,10,14,.97);display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100vh;object-fit:contain;user-select:none}
.lb-x{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.13);color:#fff;display:flex;align-items:center;justify-content:center}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.13);color:#fff;display:flex;align-items:center;justify-content:center}
.lb-nav:hover{background:rgba(255,255,255,.24)}
.lb-prev{left:16px}.lb-next{right:16px}
.lb-n{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:#fff;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.13);padding:7px 15px;border-radius:20px}

/* ---------- Admin ---------- */
.admin{min-height:100vh;background:var(--bg)}
.aheader{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.aheader .wrap{display:flex;align-items:center;gap:12px;height:62px}
.aheader b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.pill{font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:4px 9px;border-radius:6px;letter-spacing:.03em}

.login{max-width:400px;margin:0 auto;padding:80px 20px}
.loginbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow-md)}
.loginbox h2{margin:0 0 6px;font-size:21px;font-weight:700;letter-spacing:-.025em}
.loginbox>p{margin:0 0 22px;color:var(--ink-3);font-size:14px}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3);font-weight:400;margin-top:5px}
.inp{
  width:100%;height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);outline:none;font-size:14.5px;transition:.15s;
}
textarea.inp{height:auto;padding:11px 13px;resize:vertical;min-height:110px;line-height:1.55}
select.inp{appearance:none;cursor:pointer;padding-right:32px;background-image:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:grid;gap:14px}
.row-2{grid-template-columns:1fr 1fr}
.row-3{grid-template-columns:1fr 1fr 1fr}
.row-price{grid-template-columns:130px 1fr}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-sm);margin-bottom:20px}
.panel h3{margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:-.015em}
.panel .sub{margin:0 0 20px;font-size:13px;color:var(--ink-3)}

.alist{display:flex;flex-direction:column;gap:11px;padding-bottom:60px}
.arow{
  display:flex;align-items:center;gap:14px;background:var(--surface);
  border:1px solid var(--line);border-radius:13px;padding:11px;box-shadow:var(--shadow-sm);
}
.arow img,.arow .noimg{width:76px;height:60px;border-radius:9px;object-fit:cover;background:var(--line-2);flex:none}
.arow .noimg{display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.arow .meta{flex:1;min-width:0}
.arow .meta b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .meta span{font-size:12.5px;color:var(--ink-3)}
.arow .acts{display:flex;gap:7px;flex:none;flex-wrap:wrap;justify-content:flex-end}

.tabs{display:flex;gap:5px;margin-bottom:22px;background:var(--line-2);padding:4px;border-radius:11px;width:fit-content}
.tab{padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:.15s}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

.drop{
  border:2px dashed var(--line);border-radius:13px;padding:30px 20px;text-align:center;
  color:var(--ink-3);transition:.18s;cursor:pointer;background:#fcfcfd;
}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop b{display:block;color:var(--ink);font-size:14.5px;font-weight:600;margin-bottom:3px}
.drop.over b{color:var(--accent)}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:11px;margin-top:14px}
.th{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--line-2)}
.th img{width:100%;height:100%;object-fit:cover}
.th.cover{border:2px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.th-bar{position:absolute;top:0;left:0;right:0;display:flex;gap:3px;padding:5px;background:linear-gradient(rgba(0,0,0,.45),transparent)}
.th-b{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.93);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:12px;font-weight:700}
.th-b:hover{background:#fff}
.th-b.del:hover{background:#dc2626;color:#fff}
.th-cov{position:absolute;bottom:5px;left:5px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;letter-spacing:.03em}

.optgrid{display:flex;flex-wrap:wrap;gap:7px}
.opt{
  padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:500;transition:.14s;display:flex;align-items:center;gap:6px;
}
.opt:hover{border-color:#c9cdd6}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-size:14px;font-weight:500;
  z-index:300;box-shadow:var(--shadow-lg);transition:.28s cubic-bezier(.4,0,.2,1);max-width:90vw;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:#dc2626}

.bar{
  position:sticky;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:13px 0;margin-top:22px;display:flex;gap:10px;justify-content:flex-end;
}
.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:16px}
.prog{height:4px;background:var(--line-2);border-radius:3px;overflow:hidden;margin-top:12px}
.prog div{height:100%;background:var(--accent);transition:.25s;border-radius:3px}

@media(max-width:900px){
  .dcols{grid-template-columns:1fr;gap:26px}
  .aside{position:static}
  .pricebox .btn{display:none}
  .pricebox .divider{display:none}
  .mobilebar{display:flex}
  .detail{padding-bottom:76px}
  .gal{grid-template-columns:1fr}
  .gal-side{grid-template-rows:none;grid-template-columns:1fr 1fr}
  .hero h1{font-size:25px}
  .dtitle{font-size:22px}
  .row-2,.row-3{grid-template-columns:1fr}
  .hdr-actions .lbl{display:none}
  .hdr-actions .btn{padding:0 12px}
  .arow{flex-wrap:wrap}
  .arow .meta{flex-basis:calc(100% - 100px)}
}
@media(max-width:520px){
  .grid{grid-template-columns:1fr;gap:16px}
  .wrap{padding:0 15px}
}
</style>
</head>

/* ============ HELPERS ============ */
function $(id){ return document.getElementById(id); }
var app = $('app');

function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
function toast(msg, isErr){
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.className = 'toast'; }, 3400);
}
function money(v, cur){
  if (v === null || v === undefined || v === '') return 'Price on request';
  var n = Number(v);
  if (!isFinite(n)) return 'Price on request';
  return (SYM[cur] || cur || '') + ' ' + n.toLocaleString('en-US');
}
function locLine(f){
  return [f.building, f.area, f.country].filter(Boolean).join(', ');
}
function cover(f){
  var p = f.photos || [];
  if (!p.length) return null;
  return (p[f.cover_index] || p[0]).url;
}
function pageUrl(){ return location.origin + location.pathname; }
function publicUrl(path){ return SB_URL + '/storage/v1/object/public/' + BUCKET + '/' + path; }

function waLink(flat){
  var num = (SETTINGS.whatsapp_number || '').replace(/\D/g,'');
  if (!num) return null;
  var msg = 'Hi, I am interested in a property from your website.';
  if (flat) {
    msg = 'Hi, I am interested in this property:\n\n'
        + (flat.title || locLine(flat)) + '\n'
        + money(flat.price, flat.currency) + '\n'
        + pageUrl() + '#flat/' + flat.id;
  }
  return 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg);
}
function telLink(){
  var num = (SETTINGS.phone_number || '').replace(/[^\d+]/g,'');
  return num ? 'tel:' + num : null;
}

/* ============ SUPABASE VIA FETCH ============ */
function saveAuth(a){
  auth = a;
  if (a) localStorage.setItem(AUTH_KEY, JSON.stringify(a));
  else localStorage.removeItem(AUTH_KEY);
}
function storeSession(d){
  saveAuth({
    access_token : d.access_token,
    refresh_token: d.refresh_token,
    expires_at   : Date.now() + ((d.expires_in || 3600) * 1000),
    email        : (d.user && d.user.email) || (auth && auth.email) || ''
  });
}
async function signIn(email, password){
  var r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
    method:'POST',
    headers:{ 'apikey':SB_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ email:email, password:password })
  });
  var d = await r.json().catch(function(){ return {}; });
  if (!r.ok) return { error: d.error_description || d.msg || d.message || 'Sign in failed' };
  storeSession(d);
  return {};
}
async function refreshSession(){
  if (!auth || !auth.refresh_token) return false;
  var r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
    method:'POST',
    headers:{ 'apikey':SB_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ refresh_token: auth.refresh_token })
  });
  if (!r.ok) { saveAuth(null); return false; }
  var d = await r.json();
  storeSession(d);
  return true;
}
async function ensureToken(){
  if (!auth) return false;
  if (Date.now() > auth.expires_at - 60000) return await refreshSession();
  return true;
}
function signOut(){ saveAuth(null); }
function loggedIn(){ return !!auth; }

async function api(path, opts, useAuth, retried){
  opts = opts || {};
  if (useAuth) { if (!(await ensureToken())) return { error:'Session expired, please sign in again' }; }
  var headers = { 'apikey': SB_KEY };
  var k;
  if (opts.headers) for (k in opts.headers) headers[k] = opts.headers[k];
  if (useAuth && auth) headers['Authorization'] = 'Bearer ' + auth.access_token;

  var init = { method: opts.method || 'GET', headers: headers };
  if (opts.raw) { init.body = opts.raw; }
  else if (opts.body !== undefined) {
    headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(opts.body);
  }

  var r;
  try { r = await fetch(SB_URL + path, init); }
  catch(e){ return { error:'Network error. Check your internet connection.' }; }

  if (r.status === 401 && useAuth && !retried) {
    if (await refreshSession()) return api(path, opts, useAuth, true);
    return { error:'Session expired, please sign in again' };
  }
  var text = await r.text();
  var data = null;
  if (text) { try { data = JSON.parse(text); } catch(e){ data = text; } }
  if (!r.ok) {
    var m = (data && (data.message || data.error || data.msg)) || ('Request failed (' + r.status + ')');
    return { error: m };
  }
  return { data: data };
}
function rest(q, opts, useAuth){ return api('/rest/v1/' + q, opts, useAuth); }

async function uploadPhoto(blob, path){
  var headers = { 'apikey': SB_KEY, 'Content-Type':'image/jpeg', 'x-upsert':'true' };
  if (!(await ensureToken())) return { error:'Session expired' };
  headers['Authorization'] = 'Bearer ' + auth.access_token;
  var r;
  try {
    r = await fetch(SB_URL + '/storage/v1/object/' + BUCKET + '/' + path, {
      method:'POST', headers: headers, body: blob
    });
  } catch(e){ return { error:'Upload failed, check your connection' }; }
  if (!r.ok) {
    var d = await r.json().catch(function(){ return {}; });
    return { error: d.message || d.error || ('Upload failed (' + r.status + ')') };
  }
  return { data:{ path: path } };
}
async function deletePhotos(paths){
  if (!paths.length) return;
  if (!(await ensureToken())) return;
  try {
    await fetch(SB_URL + '/storage/v1/object/' + BUCKET, {
      method:'DELETE',
      headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer ' + auth.access_token, 'Content-Type':'application/json' },
      body: JSON.stringify({ prefixes: paths })
    });
  } catch(e){ /* orphaned files are harmless */ }
}

/* ============ DATA ============ */
async function loadAll(){
  var s = await rest('settings?select=*&id=eq.1', {}, false);
  var f = await rest('flats?select=*&order=sort_order.desc,created_at.desc', {}, false);
  if (s.error || f.error) throw new Error(s.error || f.error);
  SETTINGS = (s.data && s.data[0]) || {};
  FLATS    = f.data || [];
  applyTheme();
}
function applyTheme(){
  if (SETTINGS.accent_color) {
    document.documentElement.style.setProperty('--accent', SETTINGS.accent_color);
    document.documentElement.style.setProperty('--accent-soft', SETTINGS.accent_color + '14');
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', SETTINGS.accent_color);
  }
  var t = SETTINGS.site_title || 'My Properties';
  var d = SETTINGS.site_tagline || '';
  document.title = t;
  var set = function(sel, val){ var el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
  set('meta[property="og:title"]', t);
  set('meta[property="og:description"]', d);
  set('meta[name="description"]', d);
}

/* ============ ROUTER ============ */
async function route(){
  var h = location.hash;
  if (h.indexOf('#admin') === 0) return renderAdmin();
  if (h.indexOf('#flat/') === 0) {
    var id = h.slice(6);
    for (var i = 0; i < FLATS.length; i++) {
      if (FLATS[i].id === id) return renderDetail(FLATS[i]);
    }
  }
  renderList();
}
window.addEventListener('hashchange', route);

function card(f){

    + '<div class="card-img">'
    +   (img ? '<img src="' + esc(img) + '" alt="' + esc(f.title) + '" loading="lazy">' : '<div class="ph">' + I.home + '</div>')

    + '</div>'

    +   '<div class="card-price">' + money(f.price, f.currency) + (f.price_note ? ' <small>' + esc(f.price_note) + '</small>' : '') + '</div>'

    +     (f.bedrooms !== null && f.bedrooms !== undefined ? '<div class="spec">' + I.bed + ' ' + f.bedrooms + ' bed</div>' : '')
    +     (f.bathrooms !== null && f.bathrooms !== undefined ? '<div class="spec">' + I.bath + ' ' + f.bathrooms + ' bath</div>' : '')

    +     (f.floor_label ? '<div class="spec">' + I.stairs + ' ' + esc(f.floor_label) + '</div>' : '')

function renderList(){
  var list = visible();

    + '<div class="wrap">'
    + '<div class="hero"><h1>' + esc(SETTINGS.site_title || 'Available Properties') + '</h1>'
    + '<p>' + esc(SETTINGS.site_tagline || '') + '</p></div>'
    + (list.length
        ? '<div class="grid">' + list.map(card).join('') + '</div>'
        : '<div class="empty">' + I.home + '<h3>No properties yet</h3><p>Listings will appear here once added.</p></div>')
    + '</div>';

function attachCards(){
  var els = document.querySelectorAll('.card');
  for (var i = 0; i < els.length; i++) {
    els[i].onclick = function(){ location.hash = '#flat/' + this.getAttribute('data-id'); };
  }
}

    for (var i = 0; i < photos.length; i++) if (i !== ci) ordered.push(photos[i]);
    ordered = ordered.filter(Boolean);

  var wa = waLink(f), tel = telLink();
  var statusLabel = f.status === 'available' ? 'Available' : (f.status === 'reserved' ? 'Reserved' : 'Sold');

      + '<div class="gal-side">'

    } else { prompt('Copy link:', url); }
  };
  var gs = document.querySelectorAll('.gal-main,.gal-thumb');
  for (var j = 0; j < gs.length; j++) {
    gs[j].onclick = function(){ openLb(ordered, Number(this.getAttribute('data-i'))); };
  }
  window.scrollTo(0,0);
}

/* ============ LIGHTBOX ============ */
function openLb(photos, i){
  lb = { open:true, photos:photos, i:i };
  var d = document.createElement('div');
  d.className = 'lb'; d.id = 'lb';
  document.body.appendChild(d);
  document.body.style.overflow = 'hidden';
  drawLb();
  document.addEventListener('keydown', lbKeys);
}
function drawLb(){
  var d = $('lb'); if (!d) return;
  var p = lb.photos[lb.i];
  d.innerHTML = '<button class="lb-x" id="lbx">' + I.x + '</button>'
    + (lb.photos.length > 1 ? '<button class="lb-nav lb-prev" id="lbp">' + I.left + '</button><button class="lb-nav lb-next" id="lbn">' + I.right + '</button>' : '')
    + '<img src="' + esc(p.url) + '" alt="">'
    + (lb.photos.length > 1 ? '<div class="lb-n">' + (lb.i+1) + ' / ' + lb.photos.length + '</div>' : '');
  $('lbx').onclick = closeLb;
  if ($('lbp')) $('lbp').onclick = function(e){ e.stopPropagation(); step(-1); };
  if ($('lbn')) $('lbn').onclick = function(e){ e.stopPropagation(); step(1); };
  d.onclick = function(e){ if (e.target === d || e.target.tagName === 'IMG') closeLb(); };
  var x0 = null;
  d.ontouchstart = function(e){ x0 = e.touches[0].clientX; };
  d.ontouchend = function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
    x0 = null;
  };
}
function step(n){ lb.i = (lb.i + n + lb.photos.length) % lb.photos.length; drawLb(); }
function closeLb(){
  var d = $('lb'); if (d) d.parentNode.removeChild(d);
  document.body.style.overflow = '';
  lb.open = false;
  document.removeEventListener('keydown', lbKeys);
}
function lbKeys(e){
  if (!lb.open) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
}

function resize(file, max, quality){
  max = max || 1920; quality = quality || 0.82;
  return new Promise(function(resolve, reject){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      URL.revokeObjectURL(url);
      var w = img.width, h = img.height;
      if (w > max || h > max) { var r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(function(b){ b ? resolve(b) : reject(new Error('Could not process image')); }, 'image/jpeg', quality);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('Not a readable image')); };
    img.src = url;
  });
}
function wireUpload(){
  var drop = $('drop'), file = $('file');
  drop.onclick = function(){ file.click(); };
  drop.ondragover = function(e){ e.preventDefault(); drop.className = 'drop over'; };
  drop.ondragleave = function(){ drop.className = 'drop'; };
  drop.ondrop = function(e){
    e.preventDefault(); drop.className = 'drop';
    upload(Array.prototype.slice.call(e.dataTransfer.files));
  };
  file.onchange = function(e){ upload(Array.prototype.slice.call(e.target.files)); e.target.value = ''; };
}
async function upload(files){
  files = files.filter(function(f){ return f.type.indexOf('image/') === 0; });
  if (!files.length) return;
  var box = $('prog'), bar = $('progbar'), txt = $('progtxt');
  box.className = '';
  var done = 0, failed = 0, lastErr = '';
  for (var i = 0; i < files.length; i++) {
    txt.textContent = 'Uploading ' + (done+1) + ' of ' + files.length + '...';
    try {
      var blob = await resize(files[i]);
      var path = (editing.id || 'draft') + '/' + uuid() + '.jpg';
      var r = await uploadPhoto(blob, path);
      if (r.error) { failed++; lastErr = r.error; }
      else editing.photos.push({ url: publicUrl(path), path: path });
    } catch(e){ failed++; lastErr = e.message; }
    done++;
    bar.style.width = Math.round(done/files.length*100) + '%';
    drawThumbs();
  }
  txt.textContent = failed ? ((done-failed) + ' uploaded, ' + failed + ' failed') : (done + ' photo' + (done === 1 ? '' : 's') + ' uploaded');
  setTimeout(function(){ box.className = 'hide'; bar.style.width = '0%'; }, 2400);
  if (failed) toast(lastErr || (failed + ' photos could not be uploaded'), true);
}
function numOrNull(id){

async function save(){
  var f = editing;
  var payload = {
    title:$('title').value.trim(), country:$('country').value.trim(),
    area:$('area').value.trim(), building:$('building').value.trim(),
    listing_type:$('listing_type').value, status:$('status').value,
    price:numOrNull('price'), currency:$('currency').value,
    price_note:$('price_note').value.trim(),
    bedrooms:numOrNull('bedrooms'), bathrooms:numOrNull('bathrooms'),
    size_value:numOrNull('size_value'), size_unit:$('size_unit').value,
    floor_label:$('floor_label').value.trim(),
    features:f.features, facilities:f.facilities,
    description:$('description').value.trim(), map_url:$('map_url').value.trim(),
    photos:f.photos, cover_index:f.cover_index || 0,
    published:$('published').value === 'true'
  };
  if (!payload.title && !payload.area && !payload.building) {
    return toast('Add at least a title or a location', true);
  }
  $('save').disabled = true; $('save').textContent = 'Saving...';
  var r;
  if (f.id) {
    r = await rest('flats?id=eq.' + f.id, { method:'PATCH', body:payload }, true);
  } else {
    var maxSort = 0;
    FLATS.forEach(function(x){ if ((x.sort_order||0) > maxSort) maxSort = x.sort_order||0; });
    payload.sort_order = maxSort + 1;
    r = await rest('flats', { method:'POST', body:payload, headers:{ 'Prefer':'return=representation' } }, true);
  }
  if (r.error) {
    $('save').disabled = false;
    $('save').textContent = f.id ? 'Save changes' : 'Create listing';
    return toast(r.error, true);
  }
  editing = null;

  renderDash();
  toast('Saved');
}

      '<div class="panel" style="max-width:620px"><h3>Contact buttons</h3>'
    + '<p class="sub">These power the WhatsApp and Call buttons across the whole site.</p>'
    + '<div class="field"><label>WhatsApp number</label><input class="inp" id="s_wa" value="' + esc(s.whatsapp_number || '') + '" placeholder="97312345678">'
    + '<div class="hint">Country code first, digits only, no plus sign and no spaces. Bahrain example: <b>973</b> then your number.</div></div>'
    + '<div class="field"><label>Phone number for calls</label><input class="inp" id="s_ph" value="' + esc(s.phone_number || '') + '" placeholder="+97312345678">'
    + '<div class="hint">This one can include the plus sign.</div></div>'
    + '<div class="field"><label>Your name</label><input class="inp" id="s_nm" value="' + esc(s.owner_name || '') + '" placeholder="Shown under the site title"></div></div>'

    + '<div class="panel" style="max-width:620px"><h3>Site details</h3><p class="sub">What visitors see at the top of the page.</p>'
    + '<div class="field"><label>Site title</label><input class="inp" id="s_ti" value="' + esc(s.site_title || '') + '" placeholder="e.g. Sabra Properties"></div>'
    + '<div class="field"><label>Tagline</label><input class="inp" id="s_tg" value="' + esc(s.site_tagline || '') + '" placeholder="e.g. Quality flats in Bahrain"></div>'
    + '<div class="field"><label>About text (optional)</label><textarea class="inp" id="s_ab" placeholder="A short note shown on every listing page.">' + esc(s.about || '') + '</textarea></div>'
    + '<div class="row row-2">'
    + '<div class="field"><label>Default currency for new flats</label><select class="inp" id="s_cu">' + opts(CURRENCIES, s.default_currency) + '</select></div>'
    + '<div class="field"><label>Accent colour</label><input class="inp" id="s_ac" type="color" value="' + esc(s.accent_color || '#0f766e') + '" style="padding:4px;height:42px"></div>'
    + '</div><div class="bar"><button class="btn btn-solid" id="ssave">Save settings</button></div></div>';

  $('ssave').onclick = async function(){
    $('ssave').disabled = true; $('ssave').textContent = 'Saving...';
    var r = await rest('settings?id=eq.1', { method:'PATCH', body:{
      whatsapp_number: $('s_wa').value.replace(/\D/g,''),
      phone_number: $('s_ph').value.trim(),
      owner_name: $('s_nm').value.trim(),
      site_title: $('s_ti').value.trim() || 'My Properties',
      site_tagline: $('s_tg').value.trim(),
      about: $('s_ab').value.trim(),
      default_currency: $('s_cu').value,
      accent_color: $('s_ac').value
    }}, true);
    $('ssave').disabled = false; $('ssave').textContent = 'Save settings';
    if (r.error) return toast(r.error, true);
    try { await loadAll(); } catch(e){}
    renderDash();
    toast('Settings saved');
  };
}

/* ============ BOOT ============ */
(function(){
  app.innerHTML = '<div class="wrap"><div style="height:64px"></div><div class="grid" style="padding-top:40px">'
    + new Array(7).join('<div class="skel"><div class="s1"></div><div class="s2"></div><div class="s3"></div></div>')
    + '</div></div>';
  loadAll().then(function(){
    route();
  }).catch(function(e){
    console.error(e);
    app.innerHTML = '<div class="wrap"><div class="empty">' + I.home
      + '<h3>Could not reach the database</h3>'
      + '<p>Check your internet connection and refresh the page.</p></div></div>';
  });
})();
</script>
</body>
</html>
